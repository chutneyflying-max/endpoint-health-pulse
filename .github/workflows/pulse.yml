name: Endpoint Health Pulse

on:
  schedule:
    # Staggered offset schedule (independent cron registrations to prevent single-line queue drops)
    - cron: '1 * * * *'
    - cron: '16 * * * *'
    - cron: '31 * * * *'
    - cron: '46 * * * *'
  workflow_dispatch:

concurrency:
  group: endpoint-pulse
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install --omit=dev --silent --no-audit --no-fund
          if [ ! -f /usr/bin/google-chrome ]; then
            npx playwright install chromium
          fi

      - name: Run Availability Audit for Partition 1
        env:
          WP_ENDPOINT: ${{ secrets.WP_ENDPOINT }}
          INGEST_KEY: ${{ secrets.INGEST_KEY || secrets.DOWNRADAR_INGEST_SECRET }}
          DOWNRADAR_INGEST_SECRET: ${{ secrets.INGEST_KEY || secrets.DOWNRADAR_INGEST_SECRET }}
          PARTITION_ID: 1
          TOTAL_PARTITIONS: 4
          TIME_WINDOW: 'now 1-H'
          RUNNER_KEY: endpoint-pulse-runner
          CHROME_PATH: '/usr/bin/google-chrome'
        run: |
          node src/evaluator.js
          node src/metric_supplement.js || true
